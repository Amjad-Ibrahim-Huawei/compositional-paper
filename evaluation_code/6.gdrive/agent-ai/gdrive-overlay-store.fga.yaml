model: |
  model
  schema 1.1

    ########################################
    # Identities (domain + overlay)
    ########################################
    type user
      relations
        # human → agent delegation (root)
        define delegatee: [agent, agent with temporal_delegation, agent with conditional_delegation]
        define can_execute_on_my_behalf: delegatee or can_execute_on_my_behalf from delegatee

    type group
      relations
        define member: [user]
        define can_execute_on_my_behalf: can_execute_on_my_behalf from member

    type agent
      relations
        # agent → agent delegation
        define delegatee: [agent, agent with temporal_delegation, agent with conditional_delegation]
        define can_execute_on_my_behalf: delegatee or can_execute_on_my_behalf from delegatee

    type session
      relations
        define actor: [agent]
        define as_agent: actor

    type scope
      relations
        define parent: [scope]
        define holder: [session, session with temporal_access]
        define sessions: holder or sessions from parent
        define agents_direct: as_agent from holder
        define agents: agents_direct or agents from parent

   type folder
      relations
        define can_create_file: owner
        define owner: [user]
        define parent: [folder]
        define viewer: [user]
        # --- CHANGED: move group membership expansion to the object side
        #              instead of putting `group#member` directly in `viewer`.
        define group_viewer: [group]
        # --- CHANGED: user-typed viewerset; expands groups via `member from group_viewer`.
        define can_view_human: viewer or owner or member from group_viewer or viewer from parent  
        
        define in_scope: [scope]
             # --- Agents who have valid sessions in-scope (A) ---
      define agents_in_scope: agents from in_scope
      
      #     We lift human viewers/editors/owners through the chain, with parent recursion.
      define chain_agents_for_view: can_execute_on_my_behalf from viewer or can_execute_on_my_behalf from owner or chain_agents_for_view from parent  or can_execute_on_my_behalf from group_viewer
      # Intersection(A, B) using "but not"
     define delegated_agent_viewer: agents_in_scope and chain_agents_for_view
          # Final permissions (subject can be user or agent)
    
      define can_view: can_view_human or delegated_agent_viewer
      
 
       

  type doc
    relations
      define can_share: owner or owner from parent
      define can_write: owner or owner from parent

      define owner: [user]
      define parent: [folder]
      # --- CHANGED: direct viewers are user-typed and derived from folder.viewer_user
       define viewer: [user]
      # --- CHANGED: doc viewers are user-typed and derived from folder.viewer_user
      define group_viewer: [group]
      # --- CHANGED: user-typed viewerset
       
      define can_change_owner: owner
      define human_viewer: viewer or member from group_viewer  or owner or can_view_human from parent
      
      
      # --- ADDED (R1): inherit envelope/active agents from parent folder
      define agents_in_scope: agents_in_scope from parent

      # --- ADDED (R2): delegation chain lift (recurse to folder via parent)
      define chain_agents_for_view:  can_execute_on_my_behalf from viewer  or can_execute_on_my_behalf from group_viewer or can_execute_on_my_behalf from owner  or chain_agents_for_view from parent

      # --- ADDED (R3): intersection gate (envelope ∩ delegation)
      define delegated_agent_viewer: agents_in_scope and chain_agents_for_view

    # --- ADDED (R4): agent injection into read
    # (Humans unchanged; agents join via delegated_agent_viewer)
    # NOTE: doc.can_read already includes viewer/owner/parent; agents come via delegated_agent_viewer:
    # You can either leave can_read as domain-only and rely on can_view on folder,
    # OR explicitly union here if you check doc.can_read directly for agents:
    define can_read: human_viewer or delegated_agent_viewer

    ########################################
    # Guards
    ########################################
    condition temporal_access(expires_at: timestamp, current_time: timestamp) {
      current_time < expires_at
    }
    condition temporal_delegation(expires_at: timestamp, current_time: timestamp) {
      current_time < expires_at
    }
    condition conditional_delegation(allowed_purposes: list<string>, purpose: string) {
      purpose in allowed_purposes
    }


tuples:
  # --- Domain groups (unchanged)
  - user: user:anne
    relation: member
    object: group:contoso

  - user: user:beth
    relation: member
    object: group:contoso

  - user: user:charles
    relation: member
    object: group:fabrikam

  # --- Domain structure (unchanged)
  - user: folder:product-2021
    relation: parent
    object: doc:public-roadmap

  - user: folder:product-2021
    relation: parent
    object: doc:2021-roadmap

  # --- CHANGED (domain): attach group object to folder.viewer via group_viewer
  - user: group:fabrikam
    relation: group_viewer
    object: folder:product-2021

  - user: user:anne
    relation: owner
    object: folder:product-2021

  - user: user:beth
    relation: viewer
    object: doc:2021-roadmap

  # --- Overlay envelope: scope hierarchy & anchors (R1)
  - object: scope:org
    relation: parent
    user: scope:root
    
       
  - object: scope:org/eng
    relation: parent
    user: scope:org

  - object: scope:org/fin
    relation: parent
    user: scope:org


  - object: folder:product-2021
    relation: in_scope
    user: scope:org/eng

  # --- Delegations (human → agent → agent) (R5)
  - user: agent:copilot
    relation: delegatee
    object: user:charles
  #  condition:
 #     name: temporal_delegation
 #     context:
 #       expires_at: "2023-01-01T01:00:00Z"

  - user: agent:helper
    relation: delegatee
    object: agent:copilot
   # condition:
   #   name: temporal_delegation
    #  context:
     #   expires_at: "2023-01-01T00:05:00Z"

  # --- Sessions / envelope membership (R6)
  # s1: copilot session, valid in ORG until 01:00Z
  - user: agent:copilot
    relation: actor
    object: session:s1

  - user: session:s1
    relation: holder
    object: scope:org
   # condition:
    #  name: temporal_access
     # context:
     #   expires_at: "2023-01-01T01:00:00Z"

  # s2: helper session, narrowed to ENG until 00:05Z (derived from s1 in your runtime)
  - user: agent:helper
    relation: actor
    object: session:s2

  - user: session:s2
    relation: holder
    object: scope:org/eng
  #  condition:
   #   name: temporal_access
   #   context:
    #    expires_at: "2023-01-01T00:05:00Z"

  # s_only: agentX has a valid ENG session but NO human delegation → must be denied by intersection
  - user: agent:agentX
    relation: actor
    object: session:s_only

  - user: session:s_only
    relation: holder
    object: scope:org/eng
   # condition:
    #  name: temporal_access
   #   context:
   #     expires_at: "2023-01-01T01:00:00Z"


tests:
  - name: Domain baseline (humans unchanged)
    check:
      - user: user:anne
        object: doc:2021-roadmap
        assertions:
          can_write: true
      - user: user:beth
        object: doc:2021-roadmap
        assertions:
          can_change_owner: false
      - user: user:charles
        object: doc:2021-roadmap
        assertions:
          can_read: true

  - name: Anne's readable documents (domain reuse)
    list_objects:
      - user: user:anne
        type: doc
        assertions:
          can_read:
            - doc:2021-roadmap
            - doc:public-roadmap

  - name: Who can access doc:2021-roadmap (domain reuse)
    list_users:
      - object: doc:2021-roadmap
        user_filter:
          - type: user
        assertions:
          can_read:
            users:
              - user:anne     # folder owner -> viewer via parent
              - user:beth     # direct doc viewer
              - user:charles  # Fabrikam member -> folder viewer via group -> viewer via parent


  - name: Folder/document viewers after object-side group expansion (domain reuse)
    list_users:
      - object: folder:product-2021
        user_filter:
          - type: group
        assertions:
          group_viewer:
            users:
              - group:fabrikam
      - object: folder:product-2021
        user_filter:
          - type: user
        assertions:
          can_view_human:
            users:
              - user:anne
              - user:charles

  # --- Agent overlay checks
  - name: Session-only without human delegation is denied (intersection blocks)
    check:
      - user: agent:agentX
        object: doc:2021-roadmap
        context:
          current_time: "2023-01-01T00:02:00Z"
        assertions:
          can_read: false

  - name: Agent 'copilot' (ORG scope) inherits from charles (group member )
    check:
      - user: agent:copilot
        object: doc:2021-roadmap
        context:
          current_time: "2023-01-01T00:10:00Z"
        assertions:
          can_read: true
      - user: agent:copilot
        object: doc:public-roadmap
        context:
          current_time: "2023-01-01T00:10:00Z"
        assertions:
          can_read: true

  - name: Agent 'helper' (ENG scope) allowed in ENG; expires after 00:05Z
    check:
      # before expiry, ENG doc
      - user: agent:helper
        object: doc:2021-roadmap
        context:
          current_time: "2023-01-01T00:04:00Z"
        assertions:
          can_read: true
      # after expiry, denied everywhere
      - user: agent:helper
        object: doc:2021-roadmap
        context:
          current_time: "2023-01-01T00:10:00Z"
        assertions:
          can_read: false

  - name: Agent 'copilot' (ORG scope) 
    check:
      - user: agent:copilot
        object: folder:product-2021
        context:
          current_time: "2023-01-01T00:10:00Z"
        assertions:
          can_view: true
      - user: agent:helper
        object: folder:product-2021
        context:
          current_time: "2023-01-01T00:10:00Z"
        assertions:
          can_view: true    
      - user: agent:agentX
        object: folder:product-2021
        context:
          current_time: "2023-01-01T00:10:00Z"
        assertions:
          can_view: false             

  - name: Folder/document viewers after object-side group expansion (domain reuse)
    list_users:
      - object: folder:product-2021
        user_filter:
          - type: agent
        assertions:
          can_view:
            users:
              - agent:helper
              - agent:copilot


  - name: Folder/document viewers after object-side group expansion (domain reuse)
    list_users:
      - object: doc:public-roadmap
        user_filter:
          - type: agent
        assertions:
          can_read:
            users:
              - agent:helper
              - agent:copilot

 